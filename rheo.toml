version = "0.6.2"
content_dir = "content"
formats = ["html"]

# `template.typ` is a library, not a page — without this it would compile to
# its own `template.html`.
[spine]
exclude = ["template.typ"]

[html.assets]
css_stylesheet = "./style.css"
js_scripts = "./index.js"

# `@rookery` is its own repository and namespace, so nothing resolves it by
# default — rheo has to be told where it comes from.
#
# THE BRANCH, not a release, and deliberately: the 0.1.0 family has not merged
# yet, and a repository ref is consumable as it stands — the source is the
# artifact, so there is nothing to publish first and every push is picked up on
# the next build. rheo checks the ref out and keys its cache by the resolved
# commit, so a moved branch is a natural cache miss rather than a stale hit.
#
# SWAP THIS FOR `releases = "freecomputinglab/rookery"` ONCE 0.1.0 MERGES. The
# branch is expected to disappear at that point, and this stops resolving the
# moment it does. The import specs do not change either way — that is the whole
# point of the coordinate scheme.
[packages.rookery]
repo = "https://github.com/freecomputinglab/rookery"
branch = "0.1.0"
