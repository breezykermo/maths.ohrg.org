version = "0.6.1"
content_dir = "content"
formats = ["html"]

# `template.typ` is a library, not a page — without this it would compile to
# its own `template.html`.
[spine]
exclude = ["template.typ"]

[html.assets]
css_stylesheet = "./style.css"
js_scripts = "./index.js"

# `@rookery` is its own repository and namespace, so nothing resolves it by
# default — rheo has to be told where it comes from. Assets are the ordinary
# `<name>-<version>.tar.gz` release tarballs, and the local package cache is
# checked before the network, so a checkout of the family resolves offline.
[packages.rookery]
releases = "freecomputinglab/rookery"
